        @keyframes waterfallEntrance {

            to {

                transform: translateY(0) scale(1);
            }
        }

        @keyframes shimmerEffect {
            0% { transform: translateX(-150%) skewX(-25deg); }
            100% { transform: translateX(150%) skewX(-25deg); }

        /* Cascade Animation Utility */
